<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f6872" />
    <title>LIVE mobile setup</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f4f7fa; color: #15334a; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 420px); padding: 28px; border: 1px solid #d9e3ec; border-radius: 20px; background: #fff; box-shadow: 0 12px 36px #15334a12; }
      h1 { margin: 0 0 8px; color: #0f6872; font-size: 1.6rem; }
      p { line-height: 1.55; }
      code { overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <main>
      <h1>LIVE mobile</h1>
      <p>This shared app supports requester and responder accounts. Set <code>LIVE_MOBILE_SERVER_URL</code> to the hosted LIVE app address, then sync and rebuild the Android project.</p>
    </main>
  </body>
</html>
